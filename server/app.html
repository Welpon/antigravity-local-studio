<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Studio</title>
  <style>:root {
  --bg: var(--color-background-primary, #111318);
  --surface: var(--color-background-secondary, #1a1d24);
  --surface-hover: var(--color-background-tertiary, #222631);
  --text: var(--color-text-primary, #eceff4);
  --muted: var(--color-text-secondary, #9aa4b2);
  --border: var(--color-border-primary, #2c3240);
  --accent: #6366f1;
  --accent-soft: rgba(99, 102, 241, 0.16);
  --cyan: #06b6d4;
  --ok: #22c55e;
  --ok-soft: rgba(34, 197, 94, 0.15);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.16);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.16);
  --radius: var(--border-radius-md, 8px);
  --font-sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  --font-mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
}

.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 1040px;
  margin: 0 auto;
  padding: 10px 12px 24px;
  gap: 10px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  font-size: 14px;
}

.brand-icon {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, #6366f1, #06b6d4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px;
}

.tab-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background 0.15s, color 0.15s;
}

.tab-btn:hover {
  color: var(--text);
  background: var(--surface-hover);
}

.tab-btn.active {
  background: var(--accent);
  color: #fff;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}

.row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.row-nowrap {
  display: flex;
  align-items: center;
  gap: 6px;
}

.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.input,
.select,
.textarea {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 8px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}

.input,
.textarea {
  width: 100%;
}

.textarea {
  resize: vertical;
  min-height: 68px;
  font-family: var(--font-mono);
  font-size: 11.5px;
}

.input:focus,
.select:focus,
.textarea:focus {
  border-color: var(--accent);
}

.mono {
  font-family: var(--font-mono);
  font-size: 11.5px;
}

.btn {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface-hover);
  color: var(--text);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  white-space: nowrap;
}

.btn:hover:not(:disabled) {
  border-color: var(--muted);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-ok {
  background: var(--ok-soft);
  border-color: rgba(34, 197, 94, 0.4);
  color: #86efac;
}

.btn-sm {
  padding: 4px 8px;
  font-size: 11px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--surface-hover);
  color: var(--text);
  border: 1px solid var(--border);
}

.badge-ok {
  background: var(--ok-soft);
  color: #4ade80;
  border-color: rgba(34, 197, 94, 0.35);
}

.badge-warn {
  background: var(--warn-soft);
  color: #fbbf24;
  border-color: rgba(245, 158, 11, 0.35);
}

.badge-danger {
  background: var(--danger-soft);
  color: #f87171;
  border-color: rgba(239, 68, 68, 0.35);
}

.badge-accent {
  background: var(--accent-soft);
  color: #a5b4fc;
  border-color: rgba(99, 102, 241, 0.35);
}

.code-box {
  margin: 0;
  padding: 8px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 260px;
  overflow: auto;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  cursor: pointer;
}

.list-item:hover {
  background: var(--surface-hover);
}

.list-item.active {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.muted {
  color: var(--muted);
  font-size: 11.5px;
}

.empty {
  text-align: center;
  padding: 14px 8px;
  color: var(--muted);
  font-size: 12px;
}

.toast {
  padding: 8px 10px;
  border-radius: var(--radius);
  font-size: 12px;
  border: 1px solid var(--border);
}

.toast-ok {
  border-color: rgba(34, 197, 94, 0.45);
  background: var(--ok-soft);
}

.toast-err {
  border-color: rgba(239, 68, 68, 0.45);
  background: var(--danger-soft);
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  max-height: 280px;
  overflow-y: auto;
}

table.grid {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 11px;
}

table.grid th,
table.grid td {
  text-align: left;
  padding: 5px 8px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  white-space: nowrap;
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
}

table.grid th {
  position: sticky;
  top: 0;
  background: var(--surface-hover);
  color: var(--text);
  font-weight: 700;
}

.pill-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.toggle-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--muted);
  cursor: pointer;
}
</style>
